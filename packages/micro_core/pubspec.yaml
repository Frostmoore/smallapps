name: micro_core
description: >-
  Nucleo condiviso delle MicroApps: design system, acquisti, licenze, gating,
  notifiche, backup, export e gestione immagini.
version: 1.0.0
publish_to: none

# Le dipendenze si aggiungono con "pwsh tool/fl.ps1 pub add <pacchetto>" e non a mano:
# i vincoli scritti a memoria invecchiano e fanno fallire la risoluzione. Vedi F1.1.
environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.1.0
  flutter_timezone: ^5.1.0
  http: ^1.6.0
  image: ^4.9.2
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  intl: ^0.20.3
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
