<?xml version="1.0" encoding="UTF-8"?>
<!--
  La favicon della vetrina: un quadrato verde con quattro caselle chiare, che richiama
  insieme la griglia del catalogo e il calendario dell'icona di TrashCan.

  SVG e non PNG: si disegna nitida a qualunque dimensione, pesa duecento byte e non
  richiede sei file per le varie densita'.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SMP MicroApps">
  <rect width="64" height="64" rx="15" fill="#2E7D5B"/>
  <g fill="#FFFFFF">
    <rect x="14" y="14" width="15" height="15" rx="4"/>
    <rect x="35" y="14" width="15" height="15" rx="4" opacity=".72"/>
    <rect x="14" y="35" width="15" height="15" rx="4" opacity=".72"/>
    <rect x="35" y="35" width="15" height="15" rx="4" opacity=".45"/>
  </g>
</svg>
