org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Resta false perche' il modulo app applica esplicitamente il Kotlin Gradle Plugin
# (vedi app/build.gradle.kts): i due meccanismi confliggono se attivi insieme.
android.builtInKotlin=false

# ☠ Compilazione incrementale di Kotlin disattivata.
#
# Su Windows i moduli dei plugin falliscono con "Could not close incremental caches ...
# class-fq-name-to-source.tab": i file della cache restano bloccati e la build si ferma su
# un plugin diverso a ogni tentativo. Non e' un problema del nostro codice e non dipende
# da quale plugin: e' il meccanismo incrementale che non regge il locking di Windows.
#
# Il costo e' una compilazione piu' lenta dei moduli Kotlin dei plugin, che cambiano
# raramente. Il beneficio e' una build che finisce.
kotlin.incremental=false
