name: trashcan
description: Il tuo calendario della raccolta differenziata. Funziona ovunque, senza account.
publish_to: none

# versionName+versionCode. Il versionCode e' monotono crescente e non si riusa mai:
# Play rifiuta un AAB con un numero gia' visto e quel numero non si libera.
# Lo incrementa tool/build_release.ps1 prima del build. Vedi develop_microapps.md §5.4.
version: 1.0.0+10
environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

# Le versioni delle dipendenze si risolvono con "pwsh tool/fl.ps1 pub add <pacchetto>".
# Non si scrivono a memoria: un vincolo inventato fa fallire la risoluzione.
dependencies:
  # Non lo usiamo direttamente, ma senza la build avverte "Expected to find fonts for
  # packages/cupertino_icons/CupertinoIcons": qualche widget di Material vi ricorre nei
  # menu di selezione del testo, e senza il pacchetto quelle icone sarebbero quadrati
  # vuoti. Dopo il tree shaking pesa pochi KB.
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  home_widget: ^0.9.4
  intl: ^0.20.3
  meta: ^1.19.0
  micro_core:
    path: ../../packages/micro_core
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  # StreamQueue, usata nei test degli stream. E' gia' una dipendenza transitiva di
  # flutter_test, ma l'analyzer pretende che chi la importa la dichiari.
  async: ^2.13.0
  # SharedPreferences.setMockInitialValues nei test dello scheduler. E' gia' una
  # dipendenza transitiva di micro_core, ma l'analyzer pretende che chi la importa la
  # dichiari.
  shared_preferences: ^2.5.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # Outfit e' un font VARIABILE: un solo file copre tutti i pesi da 100 a 900, e pesa
  # 111 KB invece dei circa 190 KB di quattro istanze statiche.
  #
  # Google Fonts non serve piu' TTF statici via API: restituisce WOFF o WOFF2, che
  # Flutter non sa leggere, ed EOT se il client si dichiara Internet Explorer. Il file
  # qui sotto viene dal repository ufficiale google/fonts, insieme alla sua licenza
  # (assets/fonts/OFL.txt, SIL Open Font License 1.1, che ne consente l'uso in app
  # commerciali purche' il testo della licenza sia incluso).
  #
  # I pesi si ottengono con FontVariation, non dichiarando lo stesso file quattro volte:
  # Flutter non interpola da solo, e quattro dichiarazioni dello stesso file darebbero
  # sempre l'istanza predefinita. Vedi MicroTheme in micro_core.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
