# ☠ Tetto alla memoria dei demoni di build.
#
# Il template di Flutter mette -Xmx8G -XX:MaxMetaspaceSize=4G: sono i valori pensati per
# una macchina di build dedicata, non per la macchina su cui si sta anche lavorando. Il
# demone Gradle non restituisce mai la memoria che ha preso, quindi cresce fino al tetto e
# ci resta finche' non lo si uccide. Su questo progetto misurava 6 GB da solo, piu' 2 GB
# dei due demoni Kotlin.
#
# 2 GB bastano abbondantemente per un modulo app Flutter con una dozzina di plugin. Se un
# giorno una build morisse per OutOfMemory, si alza questo numero: e' un sintomo evidente,
# al contrario della RAM che sparisce in silenzio.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Il compilatore Kotlin gira in un demone suo, con un tetto suo: senza questa riga eredita
# un default generoso e si somma a quello di Gradle.
kotlin.daemon.jvmargs=-Xmx1G

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Resta false perche' il modulo app applica esplicitamente il Kotlin Gradle Plugin
# (vedi app/build.gradle.kts): i due meccanismi confliggono se attivi insieme.
android.builtInKotlin=false

# ☠ Compilazione incrementale di Kotlin disattivata.
#
# Su Windows i moduli dei plugin falliscono con "Could not close incremental caches ...
# class-fq-name-to-source.tab": i file della cache restano bloccati e la build si ferma su
# un plugin diverso a ogni tentativo. Non e' un problema del nostro codice e non dipende
# da quale plugin: e' il meccanismo incrementale che non regge il locking di Windows.
#
# Il costo e' una compilazione piu' lenta dei moduli Kotlin dei plugin, che cambiano
# raramente. Il beneficio e' una build che finisce.
kotlin.incremental=false
